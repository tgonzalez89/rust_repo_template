[package]
name = "project-name"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A short description of project-name."
license = "MIT"
repository = "https://github.com/username/project-name"
keywords = ["template"]
categories = ["development-tools"]
publish = false

[dependencies]

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"
mem_forget = "deny"
str_to_string = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
