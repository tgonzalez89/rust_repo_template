[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.95
unused-allowed-license = "allow"
unused-license-exception = "deny"
include-dev = true
include-build = true
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
